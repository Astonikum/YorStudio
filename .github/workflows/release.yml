name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package YorStudio contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate template
        run: python tools/validate_project.py templates/empty-project
      - name: Create source package
        run: |
          archive="YorStudio-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" README.md LICENSE docs templates tools .github
          echo "archive=$archive" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.archive }}

name: CI

on:
  push:
    branches: [main, "**-**"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Native project contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure native build
        run: cmake -S . -B build-native
      - name: Build native contract
        run: cmake --build build-native --config Release --parallel
      - name: Validate project template
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build-native/Release/yorstudio_project_validate.exe templates/empty-project
          else
            ./build-native/yorstudio_project_validate templates/empty-project
          fi
      - name: Run native tests
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Check required contracts
        shell: bash
        run: |
          test -f README.md
          test -f docs/product-contract.md
          test -f docs/project-format.md
          test -f docs/roadmap.md
          test -f templates/empty-project/project.yorproject
      - name: Check whitespace
        run: git diff --check
